apiVersion: apps/v1
kind: Deployment 
metadata:
    name: azure-devops-app-deployment
spec:
  replicas:  1
  selector:
    matchLabels:
      app: azure-devops-app
  template:
    metadata:
      labels:
        app: azure-devops-app

    spec:
      containers:
        - name: azure-devops-container
          image: nginx
          resources:
            limits:
              cpu: "100m"
              memory: "110Mi"
            requests:
              cpu: "80m"
              memory: "90Mi"
          ports:
              - containerPort: 80
---
apiVersion: v1
kind: Service 
metadata:
  name: azure-devops-app-service
spec:
  type: NodePort
  selector:
    app: azure-devops-app 
  ports:
       - port: 80
         targetPort: 80
         nodePort: 30030
         



        