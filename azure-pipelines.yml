trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  imageName: portfolio-app

stages:

- stage: Build

  jobs:
  - job: BuildAndPush

    steps:

    - task: Docker@2
      inputs:
        containerRegistry: 'acr-connection'
        repository: '$(imageName)'
        command: buildAndPush
        Dockerfile: '**/portfolio-app/Dockerfile'
        tags: |
          latest

- stage: Deploy

  dependsOn: Build

  jobs:
  - job: DeployToAKS

    steps:

    - task: KubernetesManifest@1
      inputs:
        action: deploy
        kubernetesServiceConnection: aks-connection
        manifests: |
           portfolio-app/portfolio-app-deploy-service.yaml