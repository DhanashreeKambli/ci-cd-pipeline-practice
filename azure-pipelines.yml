trigger:
- main

pool:
  vmImage: ubuntu-latest

stages:
- stage: Build
  jobs:
  - job: DockerBuildPush
    steps:

    - task: Docker@2
      displayName: Build and Push Docker Image
      inputs:
        containerRegistry: 'acr-connection'
        repository: 'quote-generator-app'
        command: 'buildAndPush'
        Dockerfile: '**/quote-generator-app/Dockerfile'
        tags: |
          v1