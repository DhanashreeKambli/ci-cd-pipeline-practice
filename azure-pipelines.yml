trigger:
  - main

pool:
 vmImage: ubuntu-latest
stages:
  - stage: Build
    jobs:
      - job: BuildPush
        steps:
          - task: Docker@2
            displayName: Build and Push Docker Image
            inputs:
              containerRegistry: 'acr-connection'
              repository: 'dhanuRegistry'
              command: 'buildAndPush'
              Dockerfile: '**/notes-app-1/frontend/Dockerfile'
              tags: |
                v1
