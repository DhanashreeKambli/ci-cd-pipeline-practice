<!DOCTYPE html>
<html>
<head>
    <title>Quotes App</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
            background-color: #f2f2f2;
        }

        .box {
            background: white;
            padding: 40px;
            width: 50%;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 10px gray;
        }

        h1 {
            color: #333;
        }

        p {
            font-size: 24px;
            color: #555;
        }

        button {
            padding: 10px 20px;
            background: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>Motivational Quotes</h1>
    <p>{{ quote }}</p>

    <form method="get">
        <button type="submit">New Quote</button>
    </form>
</div>

</body>
</html>
