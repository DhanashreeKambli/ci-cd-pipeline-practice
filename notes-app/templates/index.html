<!DOCTYPE html>
<html>
<head>
    <title>Notes App</title>
</head>

<body>

    <h1>My Notes App 🚀</h1>

    <form method="POST">

        <input type="text" name="note" placeholder="Enter note">

        <button type="submit">Add Note</button>

    </form>

    <hr>

    {% for note in notes %}
        <p>{{ note }}</p>
    {% endfor %}

</body>
</html>
