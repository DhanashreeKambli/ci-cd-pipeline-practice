name: CI-CD to AKS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

    # 1. Checkout code
    - name: Checkout repository
      uses: actions/checkout@v4

    # 2. Login to Docker Hub
    - name: Login to Docker Hub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    # 3. Build Docker image
    - name: Build Docker image
      run: docker build -t ${{ secrets.DOCKER_USERNAME }}/notes-app:latest .

    # 4. Push Docker image
    - name: Push Docker image
      run: docker push ${{ secrets.DOCKER_USERNAME }}/notes-app:latest

    # 5. Setup kubectl
    - name: Setup kubectl
      uses: azure/setup-kubectl@v3

    # 6. Azure Login
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    # 7. Get AKS credentials
    - name: Set AKS context
      run: |
        az aks get-credentials \
          --resource-group YOUR_RESOURCE_GROUP \
          --name YOUR_AKS_CLUSTER_NAME \
          --overwrite-existing

    # 8. Deploy to AKS
    - name: Deploy to AKS
      run: kubectl apply -f notes-app/notes-deploy-service.yaml
