apiVersion: apps/v1
kind: Deployment
metadata: 
   name: notes-app-frontend-deployment

spec:
  replicas: 1

  selector: 
    matchLabels:
      app: notes-app-frontend

  template:
    metadata:
      labels:
        app: notes-app-frontend

    spec:  
      containers:
        - name: notes-app-frontend-container
          image:  dhanuregistry.azurecr.io/notes-app-frontend-1:v1

          ports:
            - containerPort: 80

          resources:
            limits:
              memory: "500Mi"
              cpu: "300m"

            requests:
              memory: "120Mi"
              cpu: "100m"

---
apiVersion: v1
kind: Service

metadata:
  name: notes-app-frontend-service

spec:
  type: NodePort

  selector:
    app: notes-app-frontend

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30003