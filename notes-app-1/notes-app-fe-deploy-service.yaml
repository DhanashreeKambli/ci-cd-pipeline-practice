apiVersion: apps/v1
kind: Deployment
metadata: 
   name: notes-app-frontend-deployment
spec:
  replicas: 1
  selector: 
    matchLabels:
      app: notes-app-frontend
  template:
    metadata:
      labels:
        app: notes-app-frontend
    spec:  
      containers:
        - name:  notes-app-frontend-container
          image: notes-app-frontend:v1
          ports:
            - containerPort: 80
          resources:
            limits:
              memory: "128Mi"
              cpu: "170m"
            requests:
              memory: "64Mi"
              cpu: "110m"
---
apiVersion: v1
kind: Service 
metadata:
   name: notes-app-frontend-service
spec: 
  app: notes-app-frontend
  type: NodePort
  ports:
    - port: 80
      targetPort: 5000
      Nodeport: 30003